
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; overflow: hidden; }

  .scene {
    width: 100%;
    height: 520px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(160deg, #e8f5e4 0%, #f0faf0 40%, #fdf9f0 100%);
    border-radius: 16px;
  }

  .particle {
    position: absolute;
    will-change: transform, opacity;
    pointer-events: none;
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    0%   { transform: translateY(0px) translateX(0px) rotate(0deg); opacity: 0; }
    5%   { opacity: 1; }
    90%  { opacity: 0.9; }
    100% { transform: translateY(-560px) translateX(var(--drift)) rotate(var(--spin)); opacity: 0; }
  }

  @keyframes sway {
    0%, 100% { transform: rotate(-4deg); }
    50%       { transform: rotate(4deg); }
  }

  .leaf svg, .petal svg, .seed svg { display: block; }
</style>

<div class="scene" id="scene">
  <svg width="100%" height="100%" viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg" style="position:absolute;top:0;left:0;pointer-events:none;">
    <defs>
      <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#d4edda" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#d4edda" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff8e1" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#fff8e1" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <circle cx="120" cy="200" r="140" fill="url(#glow1)"/>
    <circle cx="580" cy="320" r="120" fill="url(#glow2)"/>
    <circle cx="350" cy="100" r="100" fill="url(#glow1)" opacity="0.5"/>
  </svg>
  <div id="particles"></div>
</div>

<script>
const scene = document.getElementById('scene');
const container = document.getElementById('particles');

const leafShapes = [
  `<svg width="22" height="32" viewBox="0 0 22 32"><path d="M11 1 C18 6 20 14 11 31 C2 14 4 6 11 1Z" fill="#4caf50" opacity="0.82"/><line x1="11" y1="3" x2="11" y2="29" stroke="#388e3c" stroke-width="0.8" opacity="0.6"/></svg>`,
  `<svg width="28" height="20" viewBox="0 0 28 20"><path d="M2 10 C6 2 22 2 26 10 C22 18 6 18 2 10Z" fill="#66bb6a" opacity="0.8"/><line x1="2" y1="10" x2="26" y2="10" stroke="#388e3c" stroke-width="0.7" opacity="0.5"/></svg>`,
  `<svg width="18" height="28" viewBox="0 0 18 28"><path d="M9 1 C15 5 17 13 9 27 C1 13 3 5 9 1Z" fill="#81c784" opacity="0.85"/></svg>`,
  `<svg width="30" height="22" viewBox="0 0 30 22"><path d="M1 11 C5 1 25 1 29 11 C25 21 5 21 1 11Z" fill="#a5d6a7" opacity="0.75"/></svg>`,
  `<svg width="20" height="30" viewBox="0 0 20 30"><path d="M10 2 C16 7 18 16 10 28 C2 16 4 7 10 2Z" fill="#2e7d32" opacity="0.7"/><line x1="10" y1="4" x2="10" y2="26" stroke="#1b5e20" stroke-width="0.7" opacity="0.4"/></svg>`,
  `<svg width="26" height="18" viewBox="0 0 26 18"><path d="M1 9 C6 1 20 1 25 9 C20 17 6 17 1 9Z" fill="#c8e6c9" opacity="0.9"/></svg>`,
];

const flowerShapes = [
  `<svg width="22" height="22" viewBox="0 0 22 22"><g transform="translate(11,11)">
    <ellipse cx="0" cy="-6" rx="3.5" ry="5" fill="#f48fb1" opacity="0.9"/>
    <ellipse cx="0" cy="-6" rx="3.5" ry="5" fill="#f48fb1" opacity="0.9" transform="rotate(72)"/>
    <ellipse cx="0" cy="-6" rx="3.5" ry="5" fill="#f48fb1" opacity="0.9" transform="rotate(144)"/>
    <ellipse cx="0" cy="-6" rx="3.5" ry="5" fill="#f48fb1" opacity="0.9" transform="rotate(216)"/>
    <ellipse cx="0" cy="-6" rx="3.5" ry="5" fill="#f48fb1" opacity="0.9" transform="rotate(288)"/>
    <circle cx="0" cy="0" r="3.5" fill="#ffcc80"/>
  </g></svg>`,
  `<svg width="20" height="20" viewBox="0 0 20 20"><g transform="translate(10,10)">
    <ellipse cx="0" cy="-5" rx="3" ry="4.5" fill="#ce93d8" opacity="0.85" transform="rotate(0)"/>
    <ellipse cx="0" cy="-5" rx="3" ry="4.5" fill="#ba68c8" opacity="0.85" transform="rotate(60)"/>
    <ellipse cx="0" cy="-5" rx="3" ry="4.5" fill="#ce93d8" opacity="0.85" transform="rotate(120)"/>
    <ellipse cx="0" cy="-5" rx="3" ry="4.5" fill="#ba68c8" opacity="0.85" transform="rotate(180)"/>
    <ellipse cx="0" cy="-5" rx="3" ry="4.5" fill="#ce93d8" opacity="0.85" transform="rotate(240)"/>
    <ellipse cx="0" cy="-5" rx="3" ry="4.5" fill="#ba68c8" opacity="0.85" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="3" fill="#fff59d"/>
  </g></svg>`,
  `<svg width="18" height="18" viewBox="0 0 18 18"><g transform="translate(9,9)">
    <ellipse cx="0" cy="-4.5" rx="2.5" ry="4" fill="#ef9a9a" opacity="0.9" transform="rotate(0)"/>
    <ellipse cx="0" cy="-4.5" rx="2.5" ry="4" fill="#ef9a9a" opacity="0.9" transform="rotate(90)"/>
    <ellipse cx="0" cy="-4.5" rx="2.5" ry="4" fill="#ef9a9a" opacity="0.9" transform="rotate(180)"/>
    <ellipse cx="0" cy="-4.5" rx="2.5" ry="4" fill="#ef9a9a" opacity="0.9" transform="rotate(270)"/>
    <circle cx="0" cy="0" r="3" fill="#ffe082"/>
  </g></svg>`,
  `<svg width="16" height="16" viewBox="0 0 16 16"><g transform="translate(8,8)">
    <ellipse cx="0" cy="-4" rx="2" ry="3.5" fill="#fff176" opacity="0.95" transform="rotate(0)"/>
    <ellipse cx="0" cy="-4" rx="2" ry="3.5" fill="#fff176" opacity="0.95" transform="rotate(45)"/>
    <ellipse cx="0" cy="-4" rx="2" ry="3.5" fill="#fff176" opacity="0.95" transform="rotate(90)"/>
    <ellipse cx="0" cy="-4" rx="2" ry="3.5" fill="#fff176" opacity="0.95" transform="rotate(135)"/>
    <ellipse cx="0" cy="-4" rx="2" ry="3.5" fill="#fff176" opacity="0.95" transform="rotate(180)"/>
    <ellipse cx="0" cy="-4" rx="2" ry="3.5" fill="#fff176" opacity="0.95" transform="rotate(225)"/>
    <ellipse cx="0" cy="-4" rx="2" ry="3.5" fill="#fff176" opacity="0.95" transform="rotate(270)"/>
    <ellipse cx="0" cy="-4" rx="2" ry="3.5" fill="#fff176" opacity="0.95" transform="rotate(315)"/>
    <circle cx="0" cy="0" r="2.5" fill="#ffb300"/>
  </g></svg>`,
];

const seedShapes = [
  `<svg width="10" height="10" viewBox="0 0 10 10"><ellipse cx="5" cy="5" rx="4" ry="3" fill="#a5d6a7" opacity="0.7"/></svg>`,
  `<svg width="8" height="14" viewBox="0 0 8 14"><path d="M4 1 L7 7 L4 13 L1 7 Z" fill="#c8e6c9" opacity="0.75"/></svg>`,
  `<svg width="12" height="8" viewBox="0 0 12 8"><path d="M2 4 Q6 0 10 4 Q6 8 2 4Z" fill="#b2dfdb" opacity="0.7"/></svg>`,
  `<svg width="9" height="9" viewBox="0 0 9 9"><circle cx="4.5" cy="4.5" r="3.5" fill="#ffe082" opacity="0.65"/></svg>`,
  `<svg width="16" height="10" viewBox="0 0 16 10"><path d="M1 5 C4 1 12 1 15 5" stroke="#f8bbd0" stroke-width="1.5" fill="none" opacity="0.8"/><ellipse cx="8" cy="5" rx="3" ry="2" fill="#f8bbd0" opacity="0.7"/></svg>`,
];

const allShapes = [
  ...leafShapes.map(s => ({html: s, type: 'leaf'})),
  ...flowerShapes.map(s => ({html: s, type: 'flower'})),
  ...seedShapes.map(s => ({html: s, type: 'seed'})),
];

function rand(min, max) { return Math.random() * (max - min) + min; }

function spawnParticle() {
  const shape = allShapes[Math.floor(Math.random() * allShapes.length)];
  const el = document.createElement('div');
  el.className = 'particle';

  const x = rand(0, 95);
  const duration = rand(7, 18);
  const delay = rand(0, 3);
  const drift = rand(-80, 80);
  const spin = rand(-360, 360);
  const scale = rand(0.6, 1.4);

  el.style.cssText = `
    left: ${x}%;
    bottom: -40px;
    animation-duration: ${duration}s;
    animation-delay: ${delay}s;
    --drift: ${drift}px;
    --spin: ${spin}deg;
    transform-origin: center center;
    transform: scale(${scale});
  `;
  el.innerHTML = shape.html;

  container.appendChild(el);

  setTimeout(() => el.remove(), (duration + delay + 1) * 1000);
}

let count = 0;
const MAX = 50;

function loop() {
  if (container.childElementCount < MAX) {
    spawnParticle();
    count++;
  }
  setTimeout(loop, rand(200, 600));
}

for (let i = 0; i < 20; i++) {
  setTimeout(spawnParticle, i * 100);
}
setTimeout(loop, 2200);
</script>
